name: ci

on:
  push:
  pull_request:

jobs:
  extension:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run audit:vsix

  packaged:
    runs-on: ubuntu-latest
    needs: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npx vsce package --allow-missing-repository -o elisa-vscode.vsix
      - run: npm run smoke:vsix
      - uses: actions/upload-artifact@v4
        with:
          name: elisa-vscode-vsix
          path: "*.vsix"
          if-no-files-found: error
          retention-days: 14
