name: integration

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  extension-host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run compile
      - name: Run extension-host integration tests
        if: runner.os != 'Linux'
        run: npm run test:integration
      - name: Run extension-host integration tests under xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
